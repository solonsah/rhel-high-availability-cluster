---
- name: RHEL HA cluster | Select the bootstrap node
  ansible.builtin.set_fact:
    rhel_ha_bootstrap_node: "{{ rhel_ha_cluster_nodes | first }}"
  run_once: true

- name: RHEL HA cluster | Create protected backup directory
  ansible.builtin.file:
    path: "{{ rhel_ha_configuration_backup_root }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  run_once: true
  delegate_to: "{{ rhel_ha_cluster_nodes | first }}"

- name: RHEL HA cluster | Back up existing cluster configuration
  ansible.builtin.command:
    argv:
      - pcs
      - config
      - backup
      - "{{ rhel_ha_configuration_backup_root }}/pcs-{{ ansible_date_time.iso8601_basic_short }}"
  register: rhel_ha_cluster_backup
  changed_when: rhel_ha_cluster_backup.rc == 0
  run_once: true
  delegate_to: "{{ rhel_ha_cluster_nodes | first }}"
  when: rhel_ha_corosync_configuration.stat.exists

- name: RHEL HA cluster | Authenticate cluster nodes
  ansible.builtin.command:
    argv: >-
      {{
        ['pcs', 'host', 'auth']
        + rhel_ha_cluster_nodes
        + ['-u', 'hacluster', '-p', rhel_ha_hacluster_password]
      }}
  register: rhel_ha_host_authentication
  changed_when: >-
    'Authorized' in rhel_ha_host_authentication.stdout
    or 'authorized' in rhel_ha_host_authentication.stdout
  no_log: true
  run_once: true
  delegate_to: "{{ rhel_ha_cluster_nodes | first }}"

- name: RHEL HA cluster | Create cluster configuration
  ansible.builtin.command:
    argv: >-
      {{
        ['pcs', 'cluster', 'setup', rhel_ha_cluster_name]
        + rhel_ha_cluster_nodes
      }}
  register: rhel_ha_cluster_setup
  changed_when: rhel_ha_cluster_setup.rc == 0
  run_once: true
  delegate_to: "{{ rhel_ha_cluster_nodes | first }}"
  when: not rhel_ha_corosync_configuration.stat.exists

- name: RHEL HA cluster | Enable cluster services on all nodes
  ansible.builtin.command:
    argv:
      - pcs
      - cluster
      - enable
      - --all
  register: rhel_ha_cluster_enable
  changed_when: >-
    'enabled' in rhel_ha_cluster_enable.stdout | lower
  run_once: true
  delegate_to: "{{ rhel_ha_cluster_nodes | first }}"

- name: RHEL HA cluster | Start cluster services on all nodes
  ansible.builtin.command:
    argv:
      - pcs
      - cluster
      - start
      - --all
  register: rhel_ha_cluster_start
  changed_when: >-
    'starting' in rhel_ha_cluster_start.stdout | lower
    or 'started' in rhel_ha_cluster_start.stdout | lower
  run_once: true
  delegate_to: "{{ rhel_ha_cluster_nodes | first }}"

- name: RHEL HA cluster | Set STONITH policy
  ansible.builtin.command:
    argv:
      - pcs
      - property
      - set
      - "stonith-enabled={{ rhel_ha_stonith_enabled | bool | lower }}"
  register: rhel_ha_stonith_property
  changed_when: rhel_ha_stonith_property.rc == 0
  run_once: true
  delegate_to: "{{ rhel_ha_cluster_nodes | first }}"

- name: RHEL HA cluster | Set quorum-loss policy
  ansible.builtin.command:
    argv:
      - pcs
      - property
      - set
      - "no-quorum-policy={{ rhel_ha_no_quorum_policy }}"
  register: rhel_ha_quorum_property
  changed_when: rhel_ha_quorum_property.rc == 0
  run_once: true
  delegate_to: "{{ rhel_ha_cluster_nodes | first }}"

- name: RHEL HA cluster | Set start-failure policy
  ansible.builtin.command:
    argv:
      - pcs
      - property
      - set
      - "start-failure-is-fatal={{ rhel_ha_start_failure_is_fatal | bool | lower }}"
  register: rhel_ha_start_failure_property
  changed_when: rhel_ha_start_failure_property.rc == 0
  run_once: true
  delegate_to: "{{ rhel_ha_cluster_nodes | first }}"

- name: RHEL HA cluster | Configure resource defaults
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - defaults
      - update
      - "resource-stickiness={{ rhel_ha_resource_stickiness }}"
      - "migration-threshold={{ rhel_ha_migration_threshold }}"
      - "failure-timeout={{ rhel_ha_failure_timeout }}"
  register: rhel_ha_resource_defaults
  changed_when: rhel_ha_resource_defaults.rc == 0
  run_once: true
  delegate_to: "{{ rhel_ha_cluster_nodes | first }}"
