---
- name: RHEL HA cluster | Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: RHEL HA cluster | Gather service facts
  ansible.builtin.service_facts:

- name: RHEL HA cluster | Check Corosync configuration
  ansible.builtin.stat:
    path: /etc/corosync/corosync.conf
  register: rhel_ha_corosync_configuration

- name: RHEL HA cluster | Check Pacemaker configuration database
  ansible.builtin.stat:
    path: /var/lib/pacemaker/cib/cib.xml
  register: rhel_ha_cib_configuration

- name: RHEL HA cluster | Read PCS status
  ansible.builtin.command:
    argv:
      - pcs
      - status
      - --full
  register: rhel_ha_pcs_status
  changed_when: false
  failed_when: false
  when: "'pcs' in ansible_facts.packages"

- name: RHEL HA cluster | Read quorum status
  ansible.builtin.command:
    argv:
      - pcs
      - quorum
      - status
  register: rhel_ha_pcs_quorum_status
  changed_when: false
  failed_when: false
  when: "'pcs' in ansible_facts.packages"

- name: RHEL HA cluster | Read fencing status
  ansible.builtin.command:
    argv:
      - pcs
      - stonith
      - status
  register: rhel_ha_pcs_fencing_status
  changed_when: false
  failed_when: false
  when: "'pcs' in ansible_facts.packages"

- name: RHEL HA cluster | Read resource configuration
  ansible.builtin.command:
    argv:
      - pcs
      - resource
      - config
  register: rhel_ha_pcs_resource_configuration
  changed_when: false
  failed_when: false
  when: "'pcs' in ansible_facts.packages"

- name: RHEL HA cluster | Read Corosync quorum state
  ansible.builtin.command:
    argv:
      - corosync-quorumtool
      - -s
  register: rhel_ha_corosync_quorum_state
  changed_when: false
  failed_when: false
  when: "'corosync' in ansible_facts.packages"

- name: RHEL HA cluster | Display sanitized audit summary
  ansible.builtin.debug:
    msg:
      host: "{{ inventory_hostname }}"
      distribution: "{{ ansible_facts.distribution }}"
      distribution_major_version: "{{ ansible_facts.distribution_major_version }}"
      pacemaker_installed: "{{ 'pacemaker' in ansible_facts.packages }}"
      corosync_installed: "{{ 'corosync' in ansible_facts.packages }}"
      pcs_installed: "{{ 'pcs' in ansible_facts.packages }}"
      pcsd_state: >-
        {{
          ansible_facts.services['pcsd.service'].state
          if 'pcsd.service' in ansible_facts.services
          else 'not-found'
        }}
      corosync_configuration_present: "{{ rhel_ha_corosync_configuration.stat.exists }}"
      cib_configuration_present: "{{ rhel_ha_cib_configuration.stat.exists }}"
